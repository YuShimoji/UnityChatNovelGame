site_name: UnityChatNovelGame Docs View
site_description: Local browser view for repository Markdown auditing and page translation checks.
docs_dir: .mkdocs-view
site_dir: .mkdocs-site
use_directory_urls: true

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight

plugins:
  - search

validation:
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore

nav:
  - Overview:
      - Viewer Guide: index.md
      - Agent Entry: AGENTS.md
      - Claude Entry: CLAUDE.md
      - Resume Prompt: prompt-resume.md
      - Project Overview: docs/PROJECT_OVERVIEW.md
      - Visual Progress Index: docs/VISUAL_PROGRESS_INDEX.md
      - Story Overview: docs/StorySpec/00_overview.md
      - Wiki Home: docs/wiki/README.md
      - Wiki Sidebar: docs/wiki/_sidebar.md
  - Runtime State:
      - Repo Local Rules: docs/REPO_LOCAL_RULES.md
      - Handoff: docs/HANDOFF.md
      - Supervisor Report: docs/SUPERVISOR_REPORT.md
      - Runtime State: docs/runtime-state.md
      - Project Context: docs/project-context.md
      - Invariants: docs/INVARIANTS.md
      - User Request Ledger: docs/USER_REQUEST_LEDGER.md
      - Operator Workflow: docs/OPERATOR_WORKFLOW.md
      - Interaction Notes: docs/INTERACTION_NOTES.md
      - Decision Log: docs/DECISION_LOG.md
  - Specs:
      - StorySpec:
