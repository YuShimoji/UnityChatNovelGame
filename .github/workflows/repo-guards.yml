name: Repo Guards

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
  workflow_dispatch:

jobs:
  repo-guards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check shared workflow scripts
        run: |
          node --check .shared-workflows/scripts/report-validator.js
          node --check .shared-workflows/scripts/session-end-check.js
          node --check .shared-workflows/scripts/todo-sync.js

      - name: Validate handover
        run: node .shared-workflows/scripts/report-validator.js docs/HANDOVER.md --profile handover

      - name: Validate latest orchestrator report
        shell: bash
        run: |
          latest_report="$(find docs/inbox -maxdepth 1 -name 'REPORT_ORCH_*.md' | sort | tail -n 1)"
          if [ -z "$latest_report" ]; then
            echo "No REPORT_ORCH_*.md found in docs/inbox" >&2
            exit 1
          fi
          echo "Validating $latest_report"
          node .shared-workflows/scripts/report-validator.js "$latest_report"

      - name: Session end guard
        run: node .shared-workflows/scripts/session-end-check.js --project-root . --no-fetch
